<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PadhaiPal · Alexa+ Experience</title>
<style>
  :root {
    --bg: #0b1020; --panel: #131a30; --ink: #eef1ff; --dim: #9aa3c7;
    --accent: #7dd3fc; --accent2: #c084fc; --bubble: #1b2547;
    --green: #4ade80; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 800px at 50% -10%, #182244 0%, var(--bg) 60%);
    color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 28px 16px 8px; }
  header .tag {
    display: inline-block; font-size: 12px; letter-spacing: 2px; color: var(--dim);
    border: 1px solid #2a3560; border-radius: 999px; padding: 4px 14px; margin-bottom: 12px;
  }
  h1 { margin: 6px 0 4px; font-size: 30px; }
  h1 .pal { background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: var(--dim); margin: 0 0 4px; font-size: 14px; }
  .orb {
    width: 84px; height: 84px; border-radius: 50%; margin: 14px auto;
    background: radial-gradient(circle at 35% 35%, #bfe9ff, var(--accent) 35%, #4f46e5 75%, #1e1b4b);
    box-shadow: 0 0 40px rgba(125,211,252,.45), 0 0 90px rgba(192,132,252,.25);
    transition: transform .25s ease;
  }
  .orb.listening { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(125,211,252,.45), 0 0 90px rgba(192,132,252,.25); }
    50% { transform: scale(1.12); box-shadow: 0 0 60px rgba(125,211,252,.7), 0 0 130px rgba(192,132,252,.4); }
  }
  #chat {
    width: min(680px, 94vw); height: 46vh; min-height: 300px; overflow-y: auto;
    background: rgba(19,26,48,.75); border: 1px solid #26305c; border-radius: 16px;
    padding: 16px; margin: 8px 0;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; margin: 8px 0;
    line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: #2b3a75; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: var(--bubble); border: 1px solid #2c3763; border-bottom-left-radius: 4px; }
  .cites { font-size: 12px; color: var(--dim); margin-top: 8px; border-top: 1px dashed #2c3763; padding-top: 6px; }
  .cites div { margin: 2px 0; }
  .quiz-q { background: #1a2342; border: 1px solid #33407c; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .opts { display: grid; gap: 6px; margin-top: 8px; }
  .opt { text-align: left; }
  .opt:disabled { opacity: .85; cursor: default; }
  .opt.right { border-color: var(--green) !important; box-shadow: 0 0 8px rgba(74,222,128,.4); }
  .opt.wrong { border-color: var(--red) !important; box-shadow: 0 0 8px rgba(248,113,113,.4); }
  .feedback { margin-top: 8px; font-size: 14px; }
  /* flippable flashcards */
  .fcard { background: transparent; margin: 8px 0; perspective: 800px; cursor: pointer; }
  .fin { position: relative; min-height: 130px; transform-style: preserve-3d; transition: transform .5s; }
  .fcard.flipped .fin { transform: rotateY(180deg); }
  .fface {
    background: #1a2342; border: 1px solid #33407c; border-radius: 10px; padding: 16px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .fback { position: absolute; inset: 0; transform: rotateY(180deg); color: var(--accent); }
  .fnav { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .fnav span { color: var(--dim); font-size: 13px; }
  #controls { width: min(680px, 94vw); display: flex; gap: 8px; }
  #input {
    flex: 1; background: var(--panel); border: 1px solid #2a3560; color: var(--ink);
    border-radius: 999px; padding: 12px 18px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  button {
    border: none; border-radius: 999px; padding: 12px 20px; font-size: 15px; cursor: pointer;
    background: linear-gradient(90deg, #38bdf8, #a78bfa); color: #0b1020; font-weight: 700;
  }
  button:disabled { opacity: .5; cursor: wait; }
  #mic, #tts { padding: 12px 14px; }
  #tts.off { opacity: .45; filter: grayscale(1); }
  #chips { width: min(680px, 94vw); display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip {
    background: transparent; border: 1px solid #33407c; color: var(--accent);
    font-weight: 500; font-size: 13px; padding: 7px 14px;
  }
  .chip:hover:not(:disabled) { background: #1a2342; }
  footer { color: var(--dim); font-size: 12px; margin: 18px 0 26px; text-align: center; padding: 0 16px; }
  .typing { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <div class="tag">SIMULATED ALEXA+ EXPERIENCE</div>
  <div class="orb" id="orb"></div>
  <h1>PadhaiPal <span class="pal">· पढ़ाईPal</span></h1>
  <p>Tumhara Hinglish study companion — poochho, samjho, quiz khelo.</p>
</header>

<div id="chat"></div>

<div id="chips">
  <button class="chip" data-mode="explain" data-q="gradient descent">Gradient descent samjhao</button>
  <button class="chip" data-mode="ask" data-q="overfitting kya hota hai?">Overfitting kya hai?</button>
  <button class="chip" data-mode="quiz" data-q="bias variance tradeoff">Quiz: bias-variance</button>
  <button class="chip" data-mode="flashcards" data-q="types of machine learning">Flashcards: ML types</button>
</div>

<div id="controls">
  <input id="input" placeholder="Alexa se poochho… (ya mic dabao)" autocomplete="off">
  <button id="tts" class="off" title="Voice jawab on/off">🔊</button>
  <button id="mic" title="Voice input">🎙</button>
  <button id="send">Bhejo</button>
</div>

<footer>
  Demo build for the Amazon Developer Hackathon · RAG over 134 ML study notes ·
  MCP server live at <code>/mcp</code> (Streamable HTTP)
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
const ttsBtn = document.getElementById('tts');
const orb = document.getElementById('orb');
let mode = 'ask';

/* ---------- helpers ---------- */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d); scrollDown();
  if (cls.indexOf('bot') === 0 && cls.indexOf('typing') === -1) speak(text);
  return d;
}
function addCites(cites) {
  if (!cites || !cites.length) return;
  const d = document.createElement('div');
  d.className = 'cites';
  d.innerHTML = cites.map(c =>
    `<div>[${c.n}] ${escapeHtml(c.source)} — “${escapeHtml(c.excerpt)}…”</div>`).join('');
  const bots = chat.querySelectorAll('.msg.bot');
  const last = bots[bots.length - 1];
  (last || chat).appendChild(d); scrollDown();
}

/* ---------- text-to-speech (no API key needed) ---------- */
let voiceOn = false, hindiVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    hindiVoice = vs.find(v => v.lang && v.lang.toLowerCase().indexOf('hi') === 0) || null;
  } catch (e) { /* speechSynthesis unavailable */ }
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
ttsBtn.onclick = () => {
  voiceOn = !voiceOn;
  ttsBtn.classList.toggle('off', !voiceOn);
  if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
};
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 600));
    u.lang = 'hi-IN';
    if (hindiVoice) u.voice = hindiVoice;
    speechSynthesis.speak(u);
  } catch (e) { /* ignore TTS failures */ }
}

/* ---------- interactive quiz ---------- */
let quiz = null;
function startQuiz(questions) {
  if (!questions.length) return;
  quiz = { i: 0, score: 0, qs: questions };
  renderQuizQ();
}
function renderQuizQ() {
  const q = quiz.qs[quiz.i];
  const d = document.createElement('div');
  d.className = 'quiz-q';
  d.innerHTML = `<b>Q${quiz.i + 1}/${quiz.qs.length}.</b> ${escapeHtml(q.question || '')}<div class="opts"></div>`;
  const opts = d.querySelector('.opts');
  (q.options || []).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'chip opt'; b.textContent = opt;
    b.onclick = () => gradeQuiz(opt, b, opts, d);
    opts.appendChild(b);
  });
  chat.appendChild(d); scrollDown();
}
function gradeQuiz(picked, btn, opts, box) {
  const q = quiz.qs[quiz.i];
  const ans = (q.answer || '').trim().toUpperCase().replace(/[^A-D]/g, '');
  const got = picked.trim().toUpperCase().replace(/[^A-D]/g, '').charAt(0);
  const correct = ans !== '' && got === ans.charAt(0);
  Array.from(opts.children).forEach(b => { b.disabled = true; });
  btn.classList.add(correct ? 'right' : 'wrong');
  if (!correct && ans) {
    Array.from(opts.children).forEach(b => {
      if (b.textContent.trim().toUpperCase().charAt(0) === ans.charAt(0)) b.classList.add('right');
    });
  }
  if (correct) quiz.score++;
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.textContent = (correct ? '✅ Sahi jawab! ' : '❌ Galat. ') + (q.explanation_hinglish || '');
  box.appendChild(fb);
  speak(fb.textContent);
  const nx = document.createElement('button');
  nx.className = 'chip'; nx.style.marginTop = '8px';
  nx.textContent = quiz.i + 1 < quiz.qs.length ? 'Agla question →' : 'Result dekho 🏁';
  nx.onclick = () => { quiz.i++; if (quiz.i < quiz.qs.length) renderQuizQ(); else showQuizResult(); };
  box.appendChild(nx); scrollDown();
}
function showQuizResult() {
  const s = quiz.score, n = quiz.qs.length;
  const verdict = s === n ? 'Ekdum perfect! 🌟' : s >= n / 2 ? 'Badhaai ho, aur thodi practice! 💪' : 'Koi baat nahi, notes revise karke phir try karo! 📚';
  addMsg(`Quiz khatam! Score: ${s}/${n}. ${verdict}`, 'bot');
  quiz = null;
}

/* ---------- flippable flashcards ---------- */
let deck = null;
function startCards(cards) {
  if (!cards.length) return;
  deck = { i: 0, cards };
  renderCard();
}
function renderCard() {
  const c = deck.cards[deck.i];
  const d = document.createElement('div');
  d.className = 'fcard';
  d.innerHTML =
    `<div class="fin"><div class="fface"><b>Card ${deck.i + 1}/${deck.cards.length}</b><br><br>${escapeHtml(c.front || '')}<br><br><span style="color:#9aa3c7;font-size:13px">(palatne ke liye click karo 👆)</span></div>` +
    `<div class="fface fback">${escapeHtml(c.back || '')}</div></div>` +
    `<div class="fnav"><button class="chip">← Pichla</button><span>${deck.i + 1} / ${deck.cards.length}</span><button class="chip">Agla →</button></div>`;
  d.querySelector('.fin').onclick = () => d.classList.toggle('flipped');
  const [prev, next] = d.querySelectorAll('.fnav .chip');
  prev.disabled = deck.i === 0;
  next.disabled = deck.i === deck.cards.length - 1;
  prev.onclick = e => { e.stopPropagation(); deck.i--; d.remove(); renderCard(); };
  next.onclick = e => { e.stopPropagation(); deck.i++; d.remove(); renderCard(); };
  chat.appendChild(d); scrollDown();
}

/* ---------- chat flow ---------- */
async function ask(text, m) {
  addMsg(text, 'user');
  const typing = addMsg('PadhaiPal soch raha hai…', 'bot typing');
  sendBtn.disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, mode: m || mode })
    });
    const data = await r.json();
    typing.remove();
    if (data.error) { addMsg('Oops: ' + data.error, 'bot'); return; }
    if (data.answer) addMsg(data.answer, 'bot');
    if (data.raw_text) addMsg(data.raw_text, 'bot');
    if (data.questions && data.questions.length) startQuiz(data.questions);
    if (data.cards && data.cards.length) startCards(data.cards);
    addCites(data.citations);
  } catch (e) {
    typing.remove();
    addMsg('Server se connect nahi ho paya. Kya backend chal raha hai?', 'bot');
  } finally { sendBtn.disabled = false; }
}

sendBtn.onclick = () => { const t = input.value.trim(); if (t) { input.value = ''; ask(t); } };
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.click(); });
document.querySelectorAll('#chips .chip').forEach(ch =>
  ch.onclick = () => ask(ch.dataset.q, ch.dataset.mode));

/* ---------- voice input (Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = 'hi-IN'; rec.interimResults = false;
  rec.onresult = e => { input.value = e.results[0][0].transcript; sendBtn.click(); };
  rec.onend = () => orb.classList.remove('listening');
  rec.onerror = () => { orb.classList.remove('listening'); addMsg('Mic samajh nahi paya, type karke try karo.', 'bot'); };
  micBtn.onclick = () => { orb.classList.add('listening'); try { rec.start(); } catch (e) {} };
} else {
  micBtn.style.display = 'none';
}

addMsg('Namaste! Main PadhaiPal hoon. Koi ML concept poochho — main Hinglish mein samjhaunga, tumhare notes se. 🔊 dabao to main bolkar bhi jawab dunga! 🎓', 'bot');
</script>
</body>
</html>
